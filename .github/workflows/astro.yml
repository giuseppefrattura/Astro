name: Deploy Astro site to S3

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Check generated site and redirect logic
        run: |
          npm run check:site
          npm run check:infra
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Re-copy assets so existing S3 objects also receive the cache metadata.
          # Upload HTML last so new pages never reference assets not uploaded yet.
          aws s3 cp ./dist/_astro s3://${{ secrets.S3_BUCKET }}/_astro --recursive --acl public-read --cache-control "public,max-age=31536000,immutable"
          aws s3 cp ./dist/assets s3://${{ secrets.S3_BUCKET }}/assets --recursive --acl public-read --cache-control "public,max-age=86400"
          aws s3 cp ./dist s3://${{ secrets.S3_BUCKET }} --recursive --exclude "_astro/*" --exclude "assets/*" --acl public-read --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

